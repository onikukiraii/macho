services:
  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    ports:
      - 37173:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://api:8000

  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    ports:
      - 37000:8000
    volumes:
      - ./backend:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      CELERY_BROKER_URL: redis://redis:6379/0
    command: ["uv", "run", "fastapi", "dev", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    volumes:
      - ./backend:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      CELERY_BROKER_URL: redis://redis:6379/0
    command: ["uv", "run", "celery", "-A", "worker.app", "worker", "--loglevel=info"]
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - 37306:3306
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - 37379:6379

volumes:
  mysql-data:
